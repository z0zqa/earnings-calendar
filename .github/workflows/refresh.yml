name: Refresh data

on:
  schedule:
    - cron: '23 5 * * 1-5'   # weekdays, ~7:23 Warsaw time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch.mjs
      - name: Draw logos for new companies
        run: node scripts/logos.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config.js logos
          git diff --cached --quiet || git commit -m "Data: $(date -u +%F)"
          git push
