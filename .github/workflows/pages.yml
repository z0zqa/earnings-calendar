# Publishes the app to GitHub Pages. Enable: Settings → Pages → Source: GitHub Actions,
# then Settings → Variables → PAGES_ENABLED = true. (Pages on a private repo needs GitHub Pro.)
name: Publish

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Refresh data', 'Sunday email']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip after a failed refresh, so a broken run never replaces a good page.
    if: vars.PAGES_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare site
        run: mkdir -p _site/data && cp index.html app.js styles.css config.js _site/ && cp data/earnings.js _site/data/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
