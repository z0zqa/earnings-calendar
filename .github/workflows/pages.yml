# Publikuje aplikację na GitHub Pages. Włącz: Settings → Pages → Source: GitHub Actions,
# potem Settings → Variables → PAGES_ENABLED = true. (Pages dla prywatnych repo wymaga GitHub Pro.)
name: Publikacja

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Odśwież dane', 'Niedzielny mail']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Przygotuj stronę
        run: mkdir _site && cp -r index.html app.js styles.css config.js data _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
