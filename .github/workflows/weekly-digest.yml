name: Sunday email

on:
  schedule:
    - cron: '7 16 * * 0'   # Sunday, 18:07 summer / 17:07 winter (Warsaw time)
  workflow_dispatch:
    inputs:
      week:
        description: 'Monday of the week (YYYY-MM-DD); empty = the coming week'
        required: false
      dry_run:
        description: 'Build the email only, do not send'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch.mjs ${{ inputs.week }}
      - name: Screenshot and email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/digest.mjs ${{ inputs.week && format('--week {0}', inputs.week) || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest
          path: out/
          if-no-files-found: ignore
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config.js
          git diff --cached --quiet || git commit -m "Data: $(date -u +%F)"
          git push
